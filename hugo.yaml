  experience:
    enable: true
    items:
      - company: "RootBlock Labs"
        companyUrl: "https://www.linkedin.com/company/rootblock-labs/"
        jobs:
          - name: "Computer Vision Pipeline Engineer"
            date: "September 2026 - Present"
            info:
              content: Quantized vision models and streaming pipelines for edge accelerators
            content: |
              - Write optimized vision AI pipelines for edge hardware across **NVIDIA** (L4, Jetson Orin Nano), **Intel** (Arc B580), **Qualcomm** (QCS6490 on RB3 Gen 2, Hexagon DSP) and **Blaize** Xplorer X1600 accelerators in Supermicro SYS-E300 edge systems, following one **model → quantize → compile → stream** workflow on each.
              - Brought up a **QCS6490** board from a stock Ubuntu image and deployed quantized custom vision models on its **Hexagon DSP**: assembled the FastRPC → QNN/SNPE stack by hand and traced DSP library lookups with strace, without touching the firmware. Models are quantized (int8, w8a16) with the QAIRT toolchain and onnx2tf, and run across the DSP in a multi-model **GStreamer** pipeline at **20.6 FPS** end to end on 1080p video.
              - Ran the vision encoder of OpenAI's **CLIP** (ViT-B/32) fully **int8** on the Hexagon DSP at ~20 ms per image, ~16x faster than PyTorch on the CPU, with **95.7%** zero-shot accuracy versus 98.3% in float on 300 test images. Located the accuracy loss by simulating quantization one tensor group at a time, then evaluated **SmoothQuant** and a class-token bypass that recovered 2.4 points.
              - Currently working on the **Blaize Picasso SDK** (graph compiler, runtime, quantization and pruning), GStreamer plugins for **Intel**'s Edge AI Suites (**DL Streamer**), and **NVIDIA DeepStream** pipelines.
      - company: "Cloud Tenants"
        companyUrl: "https://www.linkedin.com/company/cloud-tenants-pvt-ltd/"
        jobs:
          - name: "Computer Vision Engineer"
            date: "July 2025 - October 2026"
            info:
              content: Real-time video analytics on live retail camera feeds
            content: |
              - Built a **real-time surveillance pipeline** handling **30 live camera feeds at once** (720p, 15 FPS) with Python multiprocessing and GPU-accelerated NVDEC decoding, keeping per-stream latency low.
              - Built a **theft-detection module** that flags behaviours such as shoplifting and eating on live store footage: up to **85% detection accuracy** with as few as **2 false alerts per 5-hour window** in crowded aisles. It tracks body movement with YOLOv11-Pose and feeds temporal features (speed, angles, proximity to shelves) to a LightGBM classifier.
              - Re-implemented Ultralytics' object-tracking logic for batched inference across asynchronous streams, keeping identities stable across frames with BoT-SORT. Extended it with **TransReID** person re-identification (TensorRT FP16, batched GPU crops via RoIAlign) fused into BoT-SORT matching, **multi-camera tracking** that assigns global IDs across cameras covering the same aisle, and calibrated **stereo vision** that triangulates 2D keypoints into **3D skeletons**, all integrated into the offense-detection pipelines.
              - Built an end-to-end **planogram compliance** pipeline for retail shelf photos: YOLO26x-seg product segmentation, Perception Encoder SKU matching and perspective-corrected row/column reconstruction to flag empty and misplaced slots, reaching **98%** agreement with the client's reference planogram on a 20-photo pilot.
              - Trained the segmentation model on SKU-110K with **SAM2** pseudo-masks (no manual mask annotation) and fine-tuned **PE-Core-B16** with supervised contrastive loss on 1,599 hand-labelled crops, so new products are added from reference crops without retraining.
              - Built a data-labelling pipeline (CVAT + Nuclio serverless) with auto-suggested labels to speed up dataset preparation for the pose and classification models.
            featuredItems:
              fontAwesomeIcons:
                - icon: fab fa-github
                  url: https://github.com/Kagura-Ahad/NVDEC-ParaFlow
                  tooltip: Open-source writeup of the multi-stream decoding architecture
      - company: "Dawlance"
        jobs:
          - name: "Internship & Final Year Project"
            date: "September 2024 - June 2025"
            info:
              content: Real-time hazard detection for workplace safety
            content: |
              - Built a **real-time hazard-detection system in C++** for a workplace-safety application, using GStreamer for video handling, OpenCV DNN (YOLOv9 on GPU) for detection and a custom **C++ ByteTrack** implementation for tracking. It reached up to **90% accuracy** with near-zero false positives.
              - Made it **2x faster** by moving inference to **NVIDIA TensorRT** and rewriting core data handling directly against the CUDA API.
              - The project won the **Best FYP Award**.
            featuredItems:
              fontAwesomeIcons:
                - icon: fab fa-github
                  url: https://github.com/Kagura-Ahad/Dawlance-RTSMS-Inference-Pipeline-Optimization
                  tooltip: Stage-by-stage optimization writeup


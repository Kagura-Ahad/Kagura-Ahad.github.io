  about:
    enable: true
    title: "About Me"
    image: "/images/me.jpg"
    content: |-
      I graduated from Habib University in June 2025 with a BSc in Computer Science, and computer vision is the thread running through everything I've done since. My final year project, a real-time hazard-detection system, won the **Best FYP Award**.

      Research was something I wanted to keep doing after graduation, so I took on a low-resource NLP problem, **grammatical error correction for Urdu**, with a good team and a real data-scarcity challenge. That work was accepted to **Findings of ACL 2026**, where I am first author.

      My main focus now is **inference optimization for vision-language models**: understanding where the time and memory actually go, and how to get the same answers faster. It builds on my work as a Computer Vision Pipeline Engineer, getting quantized vision models onto edge accelerators (NVIDIA, Intel, Qualcomm, Blaize), on earlier GPU-accelerated video pipelines that ran dozens of live streams in real time, and on my open-source work on the VALI video library and Ultralytics.

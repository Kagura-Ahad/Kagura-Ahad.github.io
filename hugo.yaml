  projects:
    enable: true
    items:
      - title: Corpora Generation for Urdu GEC
        content: Learns real error patterns from Urdu Wikipedia edit history and injects them into clean sentences to build UrduGEC-Synthetic, then evaluates fine-tuned models on a new gold set drawn from students' exam copies.
        image: /images/projects/urdu-gec.svg
        featured:
          name: Paper
          link: https://aclanthology.org/2026.findings-acl.2156/
        badges:
          - "ACL Findings 2026"
          - "NLP"
          - "Low-resource"
        links:
          - icon: fas fa-file-lines
            url: https://aclanthology.org/2026.findings-acl.2156/

      - title: NVDEC-ParaFlow
        content: A pure-Python equivalent of DeepStream's nvstreammux. Decoder processes hand zero-copy GPU frames to a batched YOLO predictor via DLPack and CUDA IPC, giving +31.2% throughput over a GIL-released multithreaded design.
        image: /images/projects/paraflow.svg
        featured:
          name: Code
          link: https://github.com/Kagura-Ahad/NVDEC-ParaFlow
        badges:
          - "CUDA IPC"
          - "DLPack"
          - "NVDEC"
          - "PyTorch"
        links:
          - icon: fab fa-github
            url: https://github.com/Kagura-Ahad/NVDEC-ParaFlow

      - title: NVDEC Tensor Parity
        content: Why does swapping CPU decoding for GPU decoding change tracker IDs? Root-cause analysis and a sequential GPU emulation of the OpenCV path that restores near bit-exact input tensors.
        image: /images/projects/tensor-parity.svg
        featured:
          name: Code
          link: https://github.com/Kagura-Ahad/nvdec-tensor-parity
        badges:
          - "NVDEC"
          - "PyTorch"
          - "OpenCV"
        links:
          - icon: fab fa-github
            url: https://github.com/Kagura-Ahad/nvdec-tensor-parity

      - title: RTSMS Inference Optimization
        content: A stage-by-stage record of speeding up a YOLOv9 + ByteTrack pipeline, from ~26 FPS in PyTorch to ~85 FPS with TensorRT, with profiling, benchmarks and an honest account of what didn't work yet.
        image: /images/projects/rtsms.svg
        featured:
          name: Code
          link: https://github.com/Kagura-Ahad/Dawlance-RTSMS-Inference-Pipeline-Optimization
        badges:
          - "C++"
          - "TensorRT"
          - "ByteTrack"
        links:
          - icon: fab fa-github
            url: https://github.com/Kagura-Ahad/Dawlance-RTSMS-Inference-Pipeline-Optimization

      - title: Learning TensorRT 11
        content: A public, continuously updated log of learning NVIDIA TensorRT 11 from the ground up. Heavily documented examples of the build and V3 async runtime lifecycle, with custom type stubs and notes on why the API is designed the way it is.
        image: /images/projects/learning-tensorrt.svg
        featured:
          name: Code
          link: https://github.com/Kagura-Ahad/learning_tensorRT
        badges:
          - "TensorRT 11"
          - "Python"
          - "CUDA"
        links:
          - icon: fab fa-github
            url: https://github.com/Kagura-Ahad/learning_tensorRT

      - title: DocsKeeping
        content: A GraphRAG question-answering system that reduces LLM hallucination through knowledge-graph traversal and semantic search, with Guardrails AI anonymizing sensitive data. Co-developed as a Spring 2025 project.
